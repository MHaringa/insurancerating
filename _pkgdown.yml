url: https://mharinga.github.io/insurancerating/

template:
  math-rendering: mathjax
  bootstrap: 5
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Google Sans Code"}

navbar:
  structure:
    left:  [home, articles, reference, news]
    right: [github]

articles:
  - title: "Start here"
    contents:
      - getting-started
      - pricing-workflow-building-blocks
  - title: "Specialist guides"
    contents:
      - refinement-workflow
      - model-validation
      - large-portfolios

reference:
  - title: "Portfolio analysis"
    desc: >
      Inspect observed portfolio experience, exposure distributions and unusual
      observations before or alongside modelling.
    contents:
      - factor_analysis
      - autoplot.factor_analysis
      - outlier_histogram

  - title: "Risk-factor analysis and structuring"
    desc: >
      Analyse continuous risk relationships and translate them into practical
      tariff structures.
    contents:
      - risk_factor_gam
      - autoplot.tariff_effect
      - derive_tariff_segments
      - fisher_classify
      - add_tariff_segments

  - title: "Severity modelling"
    desc: >
      Explore claim amounts and fit severity distributions to truncated claims.
    contents:
      - plot_severity_distribution
      - fit_truncated_severity
      - autoplot.truncated_severity

  - title: "Large-loss treatment"
    desc: >
      Assess excess thresholds and redistribute large-loss experience for
      severity or risk-premium modelling.
    contents:
      - assess_excess_threshold
      - redistribute_excess_loss

  - title: "Model interpretation"
    desc: >
      Interpret fitted pricing models, compare estimated effects with observed
      portfolio experience, and add model predictions to portfolio data.
    contents:
      - rating_table
      - add_portfolio_experience
      - autoplot.rating_table
      - add_prediction

  - title: "Tariff refinement"
    desc: >
      Record, inspect and refit explicit actuarial adjustments to tariff
      relativities.
    contents:
      - prepare_refinement
      - add_smoothing
      - edit_smoothing
      - add_restriction
      - add_shrinkage
      - add_rebasing
      - add_relativities
      - relativity_specification
      - autoplot.rating_refinement
      - refit
      - audit_refinement

  - title: "Model validation"
    desc: >
      Assess model performance, resampling stability, distributional assumptions
      and residual behaviour.
    contents:
      - model_performance
      - bootstrap_performance
      - autoplot.bootstrap_performance
      - bootstrap_coefficients
      - check_overdispersion
      - check_residuals
      - autoplot.check_residuals

  - title: "Portfolio preparation and reduction"
    desc: >
      Consolidate policy periods and aggregate observed model points in memory
      or lazily in a database.
    contents:
      - merge_date_ranges
      - merge_date_ranges_db
      - rating_grid
      - rating_grid_db

  - title: "Policy period operations"
    desc: >
      Split, align and query insurance policy periods over time.
    contents:
      - split_periods_to_months
      - active_rows_by_date

  - title: "Model and supporting utilities"
    desc: >
      Recover model data, format package results and support common pricing
      calculations and simulations.
    contents:
      - extract_model_data
      - as_gt
      - set_reference_level
      - rmse
      - rlnormt
      - rgammat

  - title: "Data"
    contents:
      - MTPL
      - MTPL2

  - title: "Deprecated"
    desc: >
      Legacy functions retained for backward compatibility. New code should use the updated API.
    contents:
      - univariate
      - riskfactor_gam
      - fit_gam
      - rating_factors
      - rating_factors2
      - add_observed_experience
      - model_data
      - construct_model_points
      - construct_tariff_classes
      - bootstrap_rmse
      - fit_truncated_dist
      - fisher
      - histbin
      - biggest_reference
      - restrict_coef
      - smooth_coef
      - refit_glm
      - update_glm
      - split_relativities
      - period_to_months
      - rows_per_date
      - reduce
